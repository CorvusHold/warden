[package]
name = "common"
description = "Common utilities for the Warden service"
version = "0.1.0"
edition = "2021"

[dependencies]
config = "0.15.11"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8.12"
shellexpand = "3.1.0"
log = "0.4.27"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.13"
thiserror = "2.0"
# Encryption dependencies
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
# HOLD integration dependencies
hostname = "0.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
# Notification dependencies
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["sync", "time", "rt"] }

[dev-dependencies]
tempfile = "3.14"