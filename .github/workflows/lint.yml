name: Rust

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ "*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: warden_dev
          POSTGRES_PASSWORD: warden_dev
          POSTGRES_DB: warden_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warden_dev" --health-interval 10s --health-timeout 5s --health-retries 5
      minio:
        image: ghcr.io/corvushold/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CARGO_TERM_COLOR: always
      POSTGRES_USER: warden_dev
      POSTGRES_PASSWORD: warden_dev
      POSTGRES_DB: warden_dev
      POSTGRES_PORT: 5432
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT: http://localhost:9000
      AWS_CONSOLE_ENDPOINT: http://localhost:9001
      AWS_TEST_BUCKET: testbucket
      CI: true
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Check formatting
      run: cargo fmt -- --check
    - name: Lint with clippy
      run: cargo clippy --workspace -- -D warnings
  tests:
    runs-on: ubuntu-latest
    services:
      minio:
        image: ghcr.io/corvushold/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - uses: actions/checkout@v5
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Check Docker
      run: docker info
    - name: Install PostgreSQL client tools
      run: sudo apt update && sudo apt install -y postgresql-client
    - name: Run tests
      env:
        DOCKER_HOST: unix:///var/run/docker.sock
        TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
        TESTCONTAINERS_RYUK_DISABLED: true
        AWS_ACCESS_KEY_ID: minioadmin
        AWS_SECRET_ACCESS_KEY: minioadmin
        AWS_ENDPOINT: http://localhost:9000
        AWS_CONSOLE_ENDPOINT: http://localhost:9001
        AWS_TEST_BUCKET: testbucket
        CI: true
      run: cargo test --workspace -- --test-threads=1
        
