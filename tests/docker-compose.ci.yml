services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: warden_dev
      POSTGRES_PASSWORD: warden_dev
      POSTGRES_DB: warden_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warden_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ghcr.io/corvushold/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data

volumes:
  minio-data:
    driver: local
 