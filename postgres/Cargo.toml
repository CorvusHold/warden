[package]
name = "postgres"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
tokio-postgres = { version = "0.7.15", features = ["with-chrono-0_4", "with-uuid-1"] }
chrono = { version = "0.4.42", features = ["serde"] }
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34-deprecated"
log = "0.4.28"
env_logger = "0.11.8"
anyhow = "1.0.100"
walkdir = "2.5.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
async-trait = "0.1.89"
futures = "0.3.31"
tempfile = "3.23.0"
tar = "0.4.45"
flate2 = "1.1.5"
regex = "1.12.2"
clap = { version = "4.5.50", features = ["derive"] }
storage = { path = "../storage" }
serial_test = "3.2.0"

ssh = { path = "../ssh" }

[lib]
name = "postgres"
path = "src/lib.rs"

[dev-dependencies]
testcontainers = { version = "0.25.0", features = ["blocking"] }
tokio = { version = "1.48.0", features = ["full"] }
assert_cmd = "2.0.17"
predicates = "3.1.3"